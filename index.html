  <title>Bazi Zarb</title>

<body>
  <h1>
    Bazi Zarb
  </h1>
  <div id="digits-div">
    <input type="checkbox" id="digit1" name="digit" value="1" checked />
    <label for="digit1">1</label>
    <input type="checkbox" id="digit2" name="digit" value="2" checked />
    <label for="digit2">2</label>
    <input type="checkbox" id="digit3" name="digit" value="3" checked />
    <label for="digit3">3</label>
    <input type="checkbox" id="digit4" name="digit" value="4" checked />
    <label for="digit4">4</label>
    <input type="checkbox" id="digit5" name="digit" value="5" checked />
    <label for="digit5">5</label>
    <input type="checkbox" id="digit6" name="digit" value="6" checked />
    <label for="digit6">6</label>
    <input type="checkbox" id="digit7" name="digit" value="7" checked />
    <label for="digit7">7</label>
    <input type="checkbox" id="digit8" name="digit" value="8" checked />
    <label for="digit8">8</label>
    <input type="checkbox" id="digit9" name="digit" value="9" checked />
    <label for="digit9">9</label>
  </div>
  
  <div id="zarb-output">خروجی</div>
  <div id="answer-output">ببینم چیکار میکنی!</div>
  <input type="number" id="answer-input" placeholder="محل جواب" />
  
  
  
  <script src="./script.js">
  

  </script>
